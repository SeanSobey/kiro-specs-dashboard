<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
                   style-src {{cspSource}} 'unsafe-inline';
                   script-src 'nonce-{{nonce}}';
                   font-src {{cspSource}};">
    <link rel="stylesheet" href="{{codiconsUri}}">
    <title>Spec Detail</title>
    <style nonce="{{nonce}}">
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--vscode-font-family);
            font-size: 13px;
            color: var(--vscode-foreground);
            background: var(--vscode-editor-background);
            line-height: 1.5;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 16px 24px; }

        .spec-header { margin-bottom: 16px; }
        .spec-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .spec-meta {
            font-size: 11px; color: var(--vscode-descriptionForeground);
            display: flex; align-items: center; gap: 12px;
        }
        .badge {
            display: inline-block; padding: 1px 6px;
            background: var(--vscode-badge-background);
            color: var(--vscode-badge-foreground);
            font-size: 10px; font-weight: 600; border-radius: 2px;
        }
        .progress-bar {
            height: 6px; background: rgba(128,128,128,0.2);
            border-radius: 4px; overflow: hidden; margin: 8px 0 4px; display: flex;
        }
        .progress-fill { height: 100%; background: var(--vscode-progressBar-background); border-radius: 4px; }
        .progress-fill.optional { background: color-mix(in srgb, var(--vscode-progressBar-background) 50%, transparent); }
        .progress-text { font-size: 11px; color: var(--vscode-descriptionForeground); font-family: var(--vscode-editor-font-family); }

        .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--vscode-panel-border); }
        .tab {
            padding: 8px 16px; cursor: pointer; font-size: 12px; font-weight: 500;
            color: var(--vscode-descriptionForeground);
            border-bottom: 2px solid transparent;
            display: flex; align-items: center; gap: 6px; user-select: none;
        }
        .tab:hover { color: var(--vscode-foreground); }
        .tab.active { color: var(--vscode-foreground); border-bottom-color: var(--vscode-focusBorder); }
        .tab-badge {
            font-size: 10px; padding: 0 5px;
            background: var(--vscode-badge-background); color: var(--vscode-badge-foreground);
            border-radius: 8px; font-weight: 600;
        }

        .tab-content { display: none; padding: 12px 0; }
        .tab-content.active { display: block; }

        .task-list { list-style: none; }
        .task-item { display: flex; align-items: flex-start; gap: 8px; padding: 3px 0; }
        .task-checkbox {
            width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; cursor: pointer;
            accent-color: var(--vscode-progressBar-background);
        }
        .task-text { flex: 1; }
        .task-text.completed { text-decoration: line-through; color: var(--vscode-descriptionForeground); }
        .task-optional {
            font-size: 9px; padding: 0 4px; background: rgba(128,128,128,0.2);
            color: var(--vscode-descriptionForeground); border-radius: 2px;
            flex-shrink: 0; margin-top: 3px;
        }
        .task-indent { display: inline-block; flex-shrink: 0; }

        .file-link {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 11px; color: var(--vscode-textLink-foreground);
            cursor: pointer; margin-bottom: 8px;
        }
        .file-link:hover { text-decoration: underline; }

        .empty { padding: 24px; text-align: center; color: var(--vscode-descriptionForeground); }
        .loading { padding: 24px; text-align: center; color: var(--vscode-descriptionForeground); }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="loading">Loading spec…</div>
        <div id="content" style="display:none;">
            <div class="spec-header">
                <div class="spec-title" id="specTitle"></div>
                <div class="spec-meta" id="specMeta"></div>
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-text" id="progressText"></div>
            </div>
            <div class="tabs" id="tabs"></div>
            <div id="tabContents"></div>
        </div>
    </div>

    <script nonce="{{nonce}}">
        const vscode = acquireVsCodeApi();
        let data = null;

        vscode.postMessage({ type: 'ready' });

        window.addEventListener('message', event => {
            const msg = event.data;
            if (msg.type === 'specData') {
                data = msg;
                render();
            }
        });

        function render() {
            if (!data) return;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            // Header
            const name = data.name.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            document.getElementById('specTitle').textContent = name;

            let badge = 'TODO';
            if (data.progress === 100) badge = 'DONE';
            else if (data.progress > 0) badge = 'ACTIVE';
            const ws = data.workspaceFolder ? `[${esc(data.workspaceFolder)}] ` : '';
            document.getElementById('specMeta').innerHTML =
                `${ws}<span class="badge">${badge}</span> ` +
                `<span>${data.progress}%</span> ` +
                `<span>${data.completedTasks}/${data.totalTasks} tasks</span>` +
                (data.optionalTasks > 0 ? ` <span>${data.optionalTasks} optional</span>` : '');

            const total = data.totalTasks || 1;
            const reqPct = Math.round((data.completedRequired || 0) / total * 100);
            const optPct = Math.round((data.completedOptional || 0) / total * 100);
            document.getElementById('progressBar').innerHTML =
                `<div class="progress-fill" style="width:${reqPct}%"></div>` +
                (data.optionalTasks > 0 ? `<div class="progress-fill optional" style="width:${optPct}%"></div>` : '');
            const reqTotal = (data.totalTasks || 0) - (data.optionalTasks || 0);
            document.getElementById('progressText').textContent =
                `${data.completedRequired || 0}/${reqTotal} required` +
                (data.optionalTasks > 0 ? ` · ${data.completedOptional || 0}/${data.optionalTasks} optional` : '');

            // Tabs
            const tabsEl = document.getElementById('tabs');
            const contentsEl = document.getElementById('tabContents');
            tabsEl.innerHTML = '';
            contentsEl.innerHTML = '';

            const allTabs = [];

            // Task tabs (pre-parsed)
            (data.tabs || []).forEach(tab => {
                allTabs.push({ ...tab, kind: 'tasks' });
            });

            // Content tabs (open native preview)
            (data.contentTabs || []).forEach(ct => {
                allTabs.push({ ...ct, kind: 'content' });
            });

            if (allTabs.length === 0) {
                contentsEl.innerHTML = '<div class="empty">No files found for this spec.</div>';
                return;
            }

            allTabs.forEach((tab, i) => {
                // Tab header
                const tabEl = document.createElement('div');
                tabEl.className = 'tab' + (i === 0 ? ' active' : '');
                tabEl.dataset.tab = tab.id;

                let badgeHtml = '';
                if (tab.kind === 'tasks') {
                    badgeHtml = ` <span class="tab-badge">${tab.completedTasks}/${tab.totalTasks}</span>`;
                }
                tabEl.innerHTML = `<span class="codicon codicon-${esc(tab.icon)}"></span> ${esc(tab.label)}${badgeHtml}`;

                if (tab.kind === 'content') {
                    // Clicking a content tab opens native markdown preview
                    tabEl.addEventListener('click', () => {
                        vscode.postMessage({
                            type: 'openPreview',
                            filePath: data.path + '/' + tab.fileName
                        });
                    });
                } else {
                    tabEl.addEventListener('click', () => switchTab(tab.id));
                }
                tabsEl.appendChild(tabEl);

                // Tab content (only for task tabs)
                if (tab.kind === 'tasks') {
                    const contentEl = document.createElement('div');
                    contentEl.className = 'tab-content' + (i === 0 ? ' active' : '');
                    contentEl.id = 'tab-' + tab.id;

                    // Open file link
                    const link = document.createElement('div');
                    link.className = 'file-link';
                    link.innerHTML = `<span class="codicon codicon-go-to-file"></span> Open ${esc(tab.fileName)}`;
                    link.addEventListener('click', () => {
                        vscode.postMessage({
                            type: 'openPreview',
                            filePath: data.path + '/' + tab.fileName
                        });
                    });
                    contentEl.appendChild(link);

                    // Task list
                    if (tab.tasks && tab.tasks.length > 0) {
                        const ul = document.createElement('ul');
                        ul.className = 'task-list';
                        tab.tasks.forEach(task => {
                            const li = document.createElement('li');
                            li.className = 'task-item';

                            if (task.indent > 0) {
                                const spacer = document.createElement('span');
                                spacer.className = 'task-indent';
                                spacer.style.width = task.indent + 'px';
                                li.appendChild(spacer);
                            }

                            const cb = document.createElement('input');
                            cb.type = 'checkbox';
                            cb.className = 'task-checkbox';
                            cb.checked = task.completed;
                            cb.disabled = true;
                            li.appendChild(cb);

                            const span = document.createElement('span');
                            span.className = 'task-text' + (task.completed ? ' completed' : '');
                            span.textContent = task.text;
                            li.appendChild(span);

                            if (task.optional) {
                                const opt = document.createElement('span');
                                opt.className = 'task-optional';
                                opt.textContent = 'optional';
                                li.appendChild(opt);
                            }

                            ul.appendChild(li);
                        });
                        contentEl.appendChild(ul);
                    } else {
                        const empty = document.createElement('div');
                        empty.className = 'empty';
                        empty.textContent = 'No tasks found.';
                        contentEl.appendChild(empty);
                    }

                    contentsEl.appendChild(contentEl);
                }
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => {
                if (t.dataset.tab === tabId) t.classList.add('active');
                else if (t.dataset.tab) t.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(c => {
                c.classList.toggle('active', c.id === 'tab-' + tabId);
            });
        }

        function esc(text) {
            if (text == null) return '';
            const d = document.createElement('div');
            d.textContent = String(text);
            return d.innerHTML;
        }
    </script>
</body>
</html>
